          title: 'Affordable Hosting Options for 2026',
          excerpt: 'Where to host small business sites — good uptime, simple management, and low cost.',
          content: 'Choosing a hosting provider can significantly impact your site\'s performance and reliability. Here\'s our breakdown:\n\nShared Hosting ($5-15/month) - Great for simple sites. Limited performance, but affordable. Providers: Bluehost, SiteGround.\n\nManaged WordPress Hosting ($20-50/month) - Optimized for WordPress. Includes automatic updates and backups. Providers: Kinsta, WP Engine.\n\nCloud Hosting ($10-30/month) - Scalable, predictable pricing. Good for growing sites. Providers: AWS, DigitalOcean, Linode.\n\nStatic Site Hosting (Free-$20/month) - Fastest option for simple sites. Providers: Netlify, Vercel.\n\nFor most small businesses starting out, managed WordPress hosting offers the best balance of performance, ease-of-use, and cost. As you grow, you can always upgrade.\n\nDon\'t compromise on uptime just to save a few dollars. Reliable hosting pays for itself in increased conversions and user trust.',
          date: 'Jan 02, 2026',
          readTime: 3
        }
      ];

      function getPosts() {
        return defaultPosts;
      }

      function formatDate(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      }

      function renderPosts() {
        const container = document.getElementById('postsContainer');
        const posts = getPosts().sort((a, b) => new Date(b.date) - new Date(a.date));

        container.innerHTML = posts.map(post => `
          <article class="post" onclick="openPost(${post.id})" tabindex="0" role="button">
            <div class="post-image-wrap">
              <img
                class="post-image"
                src="${escapeHtml(post.image || '')}"
                alt="${escapeHtml(post.title)}"
                loading="lazy"
                onerror="this.style.display='none'; this.nextElementSibling.hidden=false;"
              >
              <div class="post-image-fallback" hidden>
                ${escapeHtml(post.title)}
              </div>
            </div>

            <div class="post-body">
              <h3>${escapeHtml(post.title)}</h3>
              <p>${escapeHtml(post.excerpt)}</p>
              <div class="meta">
                ${formatDate(post.date)} • ${post.readTime} min read
              </div>
            </div>
          </article>
        `).join('');
      }

      function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
      }

      // ==================== MODAL & DETAIL VIEW ====================
      const modal = document.getElementById('postModal');
      const closeModal = document.getElementById('closeModal');

      function openPost(id) {
        const posts = getPosts();
        const post = posts.find(p => p.id === id);
        if (!post) return;

        document.getElementById('modalTitle').textContent = post.title;
        document.getElementById('modalMeta').textContent = `${formatDate(post.date)} • ${post.readTime} min read`;
        document.getElementById('modalBody').innerHTML = post.content
          .split(/\n\s*\n/)
          .map(para => `<p>${para.trim().replace(/\n/g, '<br>')}</p>`)
          .join('');
        
        modal.classList.add('show');
      }

      function closeModalFn() {
        modal.classList.remove('show');
      }

      closeModal.addEventListener('click', closeModalFn);

      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModalFn();
      });

      // Close on Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModalFn();
      });

      // ==================== NAVIGATION ====================
      const toggle = document.getElementById('menuToggle');
      const nav = document.getElementById('navLinks');
      toggle && toggle.addEventListener('click', () => nav.classList.toggle('show'));

      // ==================== AD DISMISSAL ====================
      const ad = document.getElementById('bottomAd');
      const close = document.getElementById('closeAd');
      const KEY = 'tws-bottom-ad-closed';

      function isClosed() {
        try {
          const v = localStorage.getItem(KEY);
          if (!v) return false;
          const obj = JSON.parse(v);
          return Date.now() < (obj.exp || 0);
        } catch (e) { return false; }
      }

      function setClosed() {
        try { localStorage.setItem(KEY, JSON.stringify({ exp: Date.now() + 24 * 60 * 60 * 1000 })); } catch (e) { }
      }

      if (isClosed()) ad && (ad.style.display = 'none');
      close && close.addEventListener('click', () => { if (ad) ad.style.display = 'none'; setClosed(); });

      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { ad && (ad.style.display = 'none'); setClosed(); } });

      // Images are stored in assets/img/blog/.
      // Replace the JPG files there with your own images on GitHub.

      // ==================== INITIALIZE ====================
      renderPosts();

      // Make functions global for onclick handlers
      window.openPost = openPost;
    })();
  </script>
</body>
</html>
